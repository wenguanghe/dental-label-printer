services:
  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: dental-sterilization:latest
    container_name: sterilization-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - PORT=3000

volumes:
  db-data:
    driver: local
